[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epubforge"
dynamic = ["version"]
description = "Modern modular toolkit for EPUB files — validate, fix, convert, hyphenate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "chodzkos" }
]
keywords = ["epub", "ebook", "kindle", "kfx", "hyphenation", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

dependencies = [
    "lxml>=5.0",
    "pyphen>=0.15",
    "tinycss2>=1.3",
    # Raport CLI `doctor`/`info` — tabele i kolory (warstwa prezentacji, nie core).
    "rich>=13.7",
    # Lokalizacja configu wg konwencji systemu (GUI_STANDARD §8) — core, bez Qt.
    "platformdirs>=4.0",
    "tomli>=2.0; python_version<'3.11'",
    # Wspólny rdzeń GUI (paleta + config) — warstwa 0 kitu, czysty Python bez Qt;
    # core/CLI używają chodzkos_gui_kit.config i .palette. Tor Qt dokłada extra [qt].
    # Pin po pełnym SHA commitu taga (supply-chain): tag mutowalny, SHA nie. v0.5.1.
    "chodzkos-gui-kit @ git+https://github.com/chodzkos/gui-kit@44e639881a7e86600efabe74ec0c8dc8c0114fd2",  # v0.5.1
    # Mechanika sond detekcji (find_tool: PATH+extra_paths; probe_tool: obecność
    # i wersja z timeoutem, CREATE_NO_WINDOW, uruchamia rozwiązaną ścieżkę). EpubForge
    # zostaje właścicielem KOMPOZYCJI (warianty nazw, katalogi kandydatów per-narzędzie,
    # cache, override, platformowość). Pin po pełnym SHA commitu taga v0.1.2.
    "chodzkos-detection @ git+https://github.com/chodzkos/chodzkos-detection@6633745e17b170f991b8305448c3e5f96490b28f",  # v0.1.2
]

[project.optional-dependencies]
gui = [
    # Motyw/dialogi/titlebar pochodzą z chodzkos-gui-kit (ekstrakcja P1) — extra [qt]
    # dokłada PySide6. Dolny pułap 6.8 wymagany przez styleHints().colorScheme()
    # (Qt 6.5+); górny luźny, by projekt instalował się też na nowszym Pythonie.
    "PySide6>=6.8,<7",
    # Pin po pełnym SHA commitu taga (supply-chain) — musi zgadzać się z torem core. v0.5.1.
    "chodzkos-gui-kit[qt] @ git+https://github.com/chodzkos/gui-kit@44e639881a7e86600efabe74ec0c8dc8c0114fd2",  # v0.5.1
]
stats = [
    # Wykrywanie języka treści w statystykach; opcjonalne — bez niego język bierzemy
    # z metadanych EPUB-a (fallback).
    "langdetect>=1.0.9",
]
images = [
    # Optymalizacja obrazów (skalowanie/rekompresja); importowane leniwie —
    # bez tego extra fixer obrazów zgłasza czytelny błąd instalacji.
    "Pillow>=10.0",
]
fonts = [
    # Subsetting fontów (przycinanie do użytych glifów); importowane leniwie —
    # bez tego extra fixer fontów zgłasza czytelny błąd instalacji. brotli jest
    # wymagane do odczytu/zapisu WOFF2 (bez niego pliki .woff2 są pomijane).
    "fonttools>=4.50",
    "brotli>=1.1",
]
dev = [
    "babel>=2.14",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pdoc>=14.0",
    "lxml-stubs",
    # Jawnie (mimo że wciąga je pre-commit) — test bramkowy least-privilege CI
    # parsuje pliki workflow przez PyYAML.
    "pyyaml>=6.0",
    # Property-based / fuzz testy bezpieczeństwa (ZIP/XML/ścieżki).
    "hypothesis>=6.100",
]
build = [
    "babel>=2.14",
    "pyinstaller>=6.6",
    "Pillow>=10.0",
]

[project.scripts]
epubforge = "epubforge.cli.main:main"

[project.gui-scripts]
epubforge-gui = "epubforge.gui.app:main"

[project.urls]
Homepage = "https://github.com/chodzkos/epubforge"
Documentation = "https://github.com/chodzkos/epubforge/blob/main/README.md"
Repository = "https://github.com/chodzkos/epubforge"
Issues = "https://github.com/chodzkos/epubforge/issues"
Changelog = "https://github.com/chodzkos/epubforge/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/epubforge/__init__.py"

# Zależności chodzkos-gui-kit i chodzkos-detection są referencjami bezpośrednimi
# (git+https @ SHA) — do czasu ich publikacji na PyPI hatchling wymaga jawnej zgody
# na takie odwołania.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# `packages` sprawia, że hatchling pakuje CAŁE drzewo `src/epubforge` (kod +
# dane: locale/*.mo, fixers/presets, recipes_builtin, stats_stopwords,
# data/taxonomy_pl.toml, py.typed) — pliki śledzone przez git trafiają do koła
# raz. Żadnego `force-include`: te dane leżą już pod pakietem, więc jawne
# doklejanie duplikowałoby wpisy (ValueError: „second file … at the same path").
packages = ["src/epubforge"]

# ── uv (reprodukowalne buildy, REL-3) ───────────────────────────────────────────
# `uv.lock` (wersjonowany) jest źródłem prawdy o wersjach: przypina wszystkie
# zależności — w tym git-referencje chodzkos-gui-kit i chodzkos-detection (po commicie)
# i transitive z hashami. CI instaluje z locka przez `uv sync --frozen`, więc artefakty (.exe)
# i testy powstają z tych samych wersji. `pip install -e ".[dev,gui]"` nadal działa
# dla lokalnego dev-workflow (lock jest addytywny, pip go ignoruje).
[tool.uv]
required-version = ">=0.8"

# ── Ruff (linter + formatter) ──────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts dozwolone w testach
# Fixery typografii i fontów operują na „dwuznacznych" znakach (typograficzne
# cudzysłowy, pauzy, twarda spacja) — to ich domena, RUF001/002/003 tu nie mają sensu.
"src/epubforge/fixers/typography.py" = ["RUF001", "RUF002", "RUF003"]
"src/epubforge/fixers/fonts.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_typography.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_fonts.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy (type checker) ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src/epubforge"]

[[tool.mypy.overrides]]
module = [
    "pyphen",
    "tinycss2",
    "langdetect",
    "tomli",
    "PIL",
    "PIL.*",
    "fontTools",
    "fontTools.*",
]
ignore_missing_imports = true

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "gui: testy GUI (wymagają PySide6; w CI offscreen)",
    "integration: testy integracyjne (wymagają zewnętrznych narzędzi)",
    "slow: wolne testy",
    "security: testy bezpieczeństwa/odporności (fuzz, property) — osobny stabilny job CI",
]

# ── Coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/epubforge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
