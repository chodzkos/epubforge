# Hooki NARZĘDZIOWE (ruff/ruff-format/mypy) wołają `uv run` — wymaga `uv` na PATH.
# uv run używa tego samego środowiska co kanoniczne bramki (gui-kit z gita, Qt, aktualne wersje),
# więc mypy sprawdza CAŁY src/ (w tym GUI), zamiast izolowanego środowiska z pinami.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: uv run ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: ruff-format
        name: ruff (formatter)
        entry: uv run ruff format .
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: mypy
        name: mypy (type check)
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
