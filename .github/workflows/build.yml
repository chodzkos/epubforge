name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege na poziomie workflow: domyślnie ZERO uprawnień. Token nadajemy
# jawnie per-job — joby budujące tylko czytają i NIE publikują; osobny job release
# dostaje minimalny write i publikuje zweryfikowany, poświadczony artefakt (F-12/F-17).
permissions: {}

jobs:
  verify-version:
    name: Verify tag matches __version__
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Kontrola zgodności tagu z wersją (F-16)
      # Egzekwowane tylko dla tagów; workflow_dispatch (bez tagu) pomija krok, więc
      # job kończy się sukcesem i nie blokuje ręcznego builda artefaktów.
      if: startsWith(github.ref, 'refs/tags/v')
      run: python build/check_tag_version.py "$GITHUB_REF_NAME"

  build-dist:
    name: Build sdist + wheel + SBOM
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: "0.8.17"
        enable-cache: true

    - name: Setup Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: '3.12'

    - name: Build sdist + wheel (koło budowane ZE SDISTA)
      run: uv build

    - name: twine check (metadane sdista i koła)
      run: uv run --with twine twine check dist/*

    - name: Pełny test koła — instalacja w pustym venv + odczyt zasobów
      # „Pełny test wheel" przed wydaniem: koło instaluje się czysto, CLI działa,
      # a każdy pakowany zasób jest czytelny przez publiczne API SPOZA checkoutu.
      run: |
        python -m venv /tmp/relvenv
        /tmp/relvenv/bin/python -m pip install --upgrade pip
        /tmp/relvenv/bin/python -m pip install dist/epubforge-*.whl
        /tmp/relvenv/bin/epubforge --version
        /tmp/relvenv/bin/epubforge --help > /dev/null
        (cd /tmp && /tmp/relvenv/bin/python "$GITHUB_WORKSPACE/build/verify_wheel_resources.py")

    - name: Generate SBOM (CycloneDX, F-17)
      # Wykaz zależności (z uv.lock/pyproject) — dołączany do wydania, by odbiorca
      # znał pełny łańcuch dostaw artefaktu.
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
      with:
        path: .
        format: cyclonedx-json
        output-file: dist/epubforge.cdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Generate SHA256SUMS.dist (integralność dla joba release)
      working-directory: dist
      run: |
        sha256sum epubforge-*.whl epubforge-*.tar.gz epubforge.cdx.json > SHA256SUMS.dist
        cat SHA256SUMS.dist

    - name: Upload dist artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: epubforge-dist
        path: |
          dist/epubforge-*.whl
          dist/epubforge-*.tar.gz
          dist/epubforge.cdx.json
          dist/SHA256SUMS.dist
        retention-days: 30

  build-windows:
    name: Build Windows artifacts (.exe + installer)
    needs: verify-version
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv (build z uv.lock — reprodukowalne artefakty)
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: "0.8.17"
        enable-cache: true

    - name: Setup Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: '3.12'

    - name: Install dependencies (z uv.lock — te same wersje co w testach)
      run: uv sync --frozen --extra build --extra gui --python 3.12

    - name: Generate placeholder icon (gdy brak prawdziwej)
      run: uv run python build/create_icon.py

    - name: Build portable (onefile)
      working-directory: build
      run: uv run python -m PyInstaller epubforge-portable.spec --clean --noconfirm --distpath dist --workpath build-tmp

    - name: Smoke test — zasoby + kontrakt portable (onefile)
      # Zamrożony .exe waliduje pakowane zasoby przez `--self-check` i loadery
      # z sys._MEIPASS (nie z checkoutu). Onefile MUSI raportować `mode=portable`.
      working-directory: build
      shell: pwsh
      run: |
        $log = Join-Path $PWD "selfcheck-portable.log"
        $proc = Start-Process -FilePath "dist/epubforge.exe" `
          -ArgumentList "--self-check", "$log" -Wait -PassThru
        if (Test-Path $log) { Get-Content $log }
        if ($proc.ExitCode -ne 0) {
          Write-Error "portable self-check FAILED (exit $($proc.ExitCode))"
          exit 1
        }
        if (-not (Select-String -Path $log -Pattern "mode=portable" -Quiet)) {
          Write-Error "portable .exe nie zglosil mode=portable (kontrakt F-04)"
          exit 1
        }

    - name: Build onedir (do instalatora)
      working-directory: build
      run: uv run python -m PyInstaller epubforge-dir.spec --clean --noconfirm --distpath dist --workpath build-tmp

    - name: Smoke test — zasoby + kontrakt instalatora (onedir)
      working-directory: build
      shell: pwsh
      run: |
        $log = Join-Path $PWD "selfcheck-onedir.log"
        $proc = Start-Process -FilePath "dist/epubforge/epubforge.exe" `
          -ArgumentList "--self-check", "$log" -Wait -PassThru
        if (Test-Path $log) { Get-Content $log }
        if ($proc.ExitCode -ne 0) {
          Write-Error "onedir self-check FAILED (exit $($proc.ExitCode))"
          exit 1
        }
        if (-not (Select-String -Path $log -Pattern "mode=installed" -Quiet)) {
          Write-Error "onedir .exe nie zglosil mode=installed (kontrakt F-04)"
          exit 1
        }

    - name: Sign EXE (Authenticode — warunkowo, gdy dostępny certyfikat)
      # Podpisujemy portable + onedir .exe TYLKO gdy skonfigurowano bezpieczny
      # certyfikat i sekret. Brak sekretu → krok pomijany (wydanie niepodpisane,
      # ale nie zablokowane). Certyfikat trafia do RUNNER_TEMP i jest kasowany.
      if: env.WINDOWS_CERT_BASE64 != ''
      working-directory: build
      shell: pwsh
      env:
        WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1
        try {
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist/epubforge.exe" "dist/epubforge/epubforge.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool zwrocil $LASTEXITCODE" }
        } finally {
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue
        }

    - name: Install Inno Setup (pinned + wymuszona weryfikacja sumy)
      run: choco install innosetup --version=6.4.3 --require-checksums --no-progress -y

    - name: Build installer
      working-directory: build
      shell: pwsh
      run: |
        $ver = uv run python -c "import epubforge; print(epubforge.__version__)"
        & "ISCC.exe" "/DMyAppVersion=$ver" installer.iss

    - name: Sign installer (Authenticode — warunkowo)
      if: env.WINDOWS_CERT_BASE64 != ''
      working-directory: build
      shell: pwsh
      env:
        WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1
        try {
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/epubforge-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool zwrocil $LASTEXITCODE" }
        } finally {
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue
        }

    - name: Generate SHA256SUMS.windows (integralność dla joba release)
      # Sumy liczone po ewentualnym podpisie — pokrywają dokładnie publikowane pliki.
      working-directory: build/dist
      shell: pwsh
      run: |
        $lines = @(
          "$((Get-FileHash epubforge.exe -Algorithm SHA256).Hash.ToLower())  epubforge.exe"
          "$((Get-FileHash epubforge-setup.exe -Algorithm SHA256).Hash.ToLower())  epubforge-setup.exe"
        )
        Set-Content -Path SHA256SUMS.windows -Value $lines -Encoding ascii
        Get-Content SHA256SUMS.windows

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: epubforge-windows
        path: |
          build/dist/epubforge.exe
          build/dist/epubforge-setup.exe
          build/dist/SHA256SUMS.windows
        retention-days: 30

  release:
    name: Publish GitHub Release (signed provenance)
    needs: [build-dist, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Minimalny write: utworzenie Release (contents) + poświadczenie pochodzenia
    # (id-token/attestations). Job NIE instaluje zależności i NIE checkoutuje repo —
    # konsumuje wyłącznie gotowe, zweryfikowane artefakty.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Download Windows artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: epubforge-windows
        path: dist

    - name: Download dist artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: epubforge-dist
        path: dist

    - name: Verify per-job SHA256SUMS (zweryfikowany artefakt przed publikacją)
      # Potwierdzamy, że publikujemy dokładnie to, co zbudowały nieuprzywilejowane
      # joby — niezgodność którejkolwiek sumy przerywa release (fail-closed).
      working-directory: dist
      run: |
        sha256sum -c SHA256SUMS.windows
        sha256sum -c SHA256SUMS.dist

    - name: Build combined SHA256SUMS (asset wydania)
      # Jeden plik sum dla odbiorcy — obejmuje wszystkie publikowane artefakty.
      working-directory: dist
      run: |
        sha256sum epubforge.exe epubforge-setup.exe epubforge-*.whl epubforge-*.tar.gz \
          epubforge.cdx.json > SHA256SUMS
        cat SHA256SUMS

    - name: Attestation provenance (F-17)
      # Poświadczenie pochodzenia (SLSA provenance) dla każdego artefaktu. Odbiorca
      # weryfikuje: `gh attestation verify <plik> --repo chodzkos/epubforge`.
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
      with:
        subject-path: |
          dist/epubforge.exe
          dist/epubforge-setup.exe
          dist/epubforge-*.whl
          dist/epubforge-*.tar.gz

    - name: Create Release
      uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0  # v3.0.2
      with:
        files: |
          dist/epubforge.exe
          dist/epubforge-setup.exe
          dist/epubforge-*.whl
          dist/epubforge-*.tar.gz
          dist/epubforge.cdx.json
          dist/SHA256SUMS
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
