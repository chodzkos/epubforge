name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Tworzenie Release wymaga zapisu w repo (inaczej GITHUB_TOKEN dostaje 403).
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

    - name: Install uv (build z uv.lock — reprodukowalne artefakty)
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: "0.8.17"
        enable-cache: true

    - name: Setup Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: '3.12'

    - name: Install dependencies (z uv.lock — te same wersje co w testach)
      # `--frozen`: .exe powstaje ze ściśle zablokowanych wersji (lxml, PySide6,
      # PyInstaller, Pillow itd.), więc Release jest reprodukowalny.
      run: uv sync --frozen --extra build --extra gui --python 3.12

    - name: Generate placeholder icon (gdy brak prawdziwej)
      run: uv run python build/create_icon.py

    - name: Build portable (onefile)
      working-directory: build
      run: uv run python -m PyInstaller epubforge-portable.spec --clean --noconfirm --distpath dist --workpath build-tmp

    - name: Smoke test — zasoby w portable (onefile)
      # Zamrożony .exe waliduje pakowane zasoby przez `--self-check` i loadery
      # z sys._MEIPASS (nie z checkoutu). Brak dowolnego zasobu → kod ≠ 0 →
      # release przerwany. Windowed build (console=False) nie zwraca kodu do
      # konsoli — używamy Start-Process -Wait -PassThru, a log czytamy z pliku.
      working-directory: build
      shell: pwsh
      run: |
        $log = Join-Path $PWD "selfcheck-portable.log"
        $proc = Start-Process -FilePath "dist/epubforge.exe" `
          -ArgumentList "--self-check", "$log" -Wait -PassThru
        if (Test-Path $log) { Get-Content $log }
        if ($proc.ExitCode -ne 0) {
          Write-Error "portable self-check FAILED (exit $($proc.ExitCode))"
          exit 1
        }

    - name: Build onedir (do instalatora)
      working-directory: build
      run: uv run python -m PyInstaller epubforge-dir.spec --clean --noconfirm --distpath dist --workpath build-tmp

    - name: Smoke test — zasoby w onedir
      working-directory: build
      shell: pwsh
      run: |
        $log = Join-Path $PWD "selfcheck-onedir.log"
        $proc = Start-Process -FilePath "dist/epubforge/epubforge.exe" `
          -ArgumentList "--self-check", "$log" -Wait -PassThru
        if (Test-Path $log) { Get-Content $log }
        if ($proc.ExitCode -ne 0) {
          Write-Error "onedir self-check FAILED (exit $($proc.ExitCode))"
          exit 1
        }

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Build installer
      working-directory: build
      shell: pwsh
      run: |
        $ver = uv run python -c "import epubforge; print(epubforge.__version__)"
        & "ISCC.exe" "/DMyAppVersion=$ver" installer.iss

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: epubforge-windows
        path: |
          build/dist/epubforge.exe
          build/dist/epubforge-setup.exe
        retention-days: 30

    - name: Create Release (only on tags)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
      with:
        files: |
          build/dist/epubforge.exe
          build/dist/epubforge-setup.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
