name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Cotygodniowy skan (poniedziałek) — łapie podatności w kodzie/wzorcach, które
    # ujawniły się między pushami (nowe reguły CodeQL). Off-minute, by nie kumulować
    # startów z innymi repozytoriami.
    - cron: '27 4 * * 1'

# CodeQL zapisuje wyniki do zakładki Security (Code scanning) — stąd
# security-events: write; reszta uprawnień tylko-do-odczytu.
permissions:
  contents: read
  security-events: write
  actions: read

# Nowy push na tę samą gałąź anuluje wcześniejszy skan (spójnie z test.yml).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Analiza CodeQL czyta źródła, ale niczego nie pushuje — bez utrwalonego tokenu.
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
      with:
        languages: python

    # Python jest interpretowany — CodeQL ekstrahuje kod bez kroku budowania.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
      with:
        category: "/language:python"
