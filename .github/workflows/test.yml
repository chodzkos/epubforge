name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# Nowy push na tę samą gałąź anuluje wcześniejszy bieg (GUI_STANDARD §9) —
# oszczędza minuty CI.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Qt runtime libs (Linux only — dla testów GUI offscreen)
      # PySide6 w trybie offscreen i tak wymaga libEGL na headless Linuksie.
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

    - name: Install dependencies
      # [gui] (PySide6) wymagane także w CI: mypy potrzebuje stubów Qt, a testy
      # GUI importują PySide6 (renderowanie bezgłowe przez platformę 'offscreen').
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,gui]"

    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type check with mypy (wszystkie platformy)
      # Sprawdzamy każdą platformę jawnie — kod warunkowany sys.platform
      # może mieć błędy widoczne tylko pod konkretnym --platform (np. unreachable).
      run: |
        mypy --platform linux src/
        mypy --platform darwin src/
        mypy --platform win32 src/

    - name: Test with pytest (offscreen Qt — wszystkie platformy)
      # PySide6 renderuje bezgłowo przez platformę 'offscreen' — bez xvfb i bez
      # wyłączania testów GUI na Windows/macOS.
      env:
        QT_QPA_PLATFORM: offscreen
      run: pytest --cov=src/epubforge --cov-report=xml -m "not integration"

    - name: Upload coverage (Linux + Python 3.12 only)
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Security audit (pip-audit — Linux + Python 3.12 only)
      # Audyt znanych podatności (CVE) w drzewie zależności. Projekt używa pip
      # (nie uv), więc requirements bierzemy z `pip freeze`. Wykluczamy git-depsy
      # (chodzkos-gui-kit @ git+…) i sam edytowalny projekt — pip-audit nie zna ich
      # w PyPI, a z git-URL-em w requirements wywala się na resolverze. Transitive
      # zależności git-depsu to zwykłe pakiety PyPI i zostają objęte audytem.
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      run: |
        # Freeze PRZED instalacją pip-audit, żeby audytować tylko zależności
        # projektu, a nie samo narzędzie i jego drzewo.
        pip freeze --exclude-editable | grep -viE 'git\+|^epubforge( |@|==)' > req-audit.txt
        python -m pip install pip-audit
        pip-audit -r req-audit.txt
