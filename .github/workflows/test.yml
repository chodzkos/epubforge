name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# Nowy push na tę samą gałąź anuluje wcześniejszy bieg (GUI_STANDARD §9) —
# oszczędza minuty CI.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Least privilege (F-12): wszystkie joby uruchamiają kod zależności (pytest,
# pip-audit, build koła) — dostają WYŁĄCZNIE odczyt repo. Żaden krok tu nic nie
# publikuje; upload coverage do Codecov działa bez tokenu zapisu.
permissions:
  contents: read

jobs:
  test:
    name: Unit + GUI fallback Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.13: lxml ma koła cp313 na wszystkich OS matrycy, a PySide6 instaluje
        # się przez koło abi3 (cp310-abi3 działa na 3.10+). Brak wykluczeń.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Bez utrwalania tokenu w .git/config — kod zależności go nie zobaczy.
        persist-credentials: false

    - name: Install uv (instalacja z uv.lock — reprodukowalne wersje)
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: "0.8.17"
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Qt runtime libs (Linux only — dla testów GUI offscreen)
      # PySide6 w trybie offscreen i tak wymaga libEGL na headless Linuksie.
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

    - name: Install dependencies (z uv.lock — te same wersje wszędzie)
      # `--frozen`: instalacja ściśle z locka; niezgodność lock↔pyproject = błąd
      # (wymusza świadome `uv lock` przy zmianie zależności). [gui] (PySide6)
      # potrzebne w CI: mypy wymaga stubów Qt, a testy GUI importują PySide6.
      run: uv sync --frozen --extra dev --extra gui --extra images --extra fonts --python ${{ matrix.python-version }}

    - name: Lint with ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check with mypy (wszystkie platformy)
      # Sprawdzamy każdą platformę jawnie — kod warunkowany sys.platform
      # może mieć błędy widoczne tylko pod konkretnym --platform (np. unreachable).
      run: |
        uv run mypy --platform linux src/
        uv run mypy --platform darwin src/
        uv run mypy --platform win32 src/

    - name: Unit + GUI fallback (bez Chromium)
      # PySide6 renderuje bezgłowo przez platformę 'offscreen' — bez xvfb i bez
      # wyłączania testów GUI na Windows/macOS.
      # Pokrycie liczone na CAŁYM kodzie (GUI włącznie — patrz brak omit w
      # [tool.coverage.run]). Po wydzieleniu testów Chromium ten tor ma zmierzone
      # 80% na Linuksie; osobny raport WebEngine jest łączony przez Codecov.
      env:
        QT_QPA_PLATFORM: offscreen
      run: uv run pytest --cov=src/epubforge --cov-report=xml --cov-fail-under=80 -m "not integration and not webengine"

    - name: Upload coverage (Linux + Python 3.12 only)
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        files: ./coverage.xml
        flags: fallback
        fail_ci_if_error: false

    - name: Security audit (pip-audit — Linux + Python 3.12 only)
      # Audyt znanych podatności (CVE) w drzewie zależności. Requirements
      # eksportujemy z locka (`uv export`), z pominięciem git-depsu
      # chodzkos-gui-kit (brak w PyPI, wywala resolver pip-audit) i samego
      # projektu. Transitive zależności git-depsu to zwykłe pakiety PyPI i
      # pozostają objęte audytem.
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      run: |
        uv export --frozen --no-emit-project --no-emit-package chodzkos-gui-kit \
          --extra dev --extra gui --extra images --extra fonts --no-hashes --format requirements-txt > req-audit.txt
        uv run --with pip-audit pip-audit -r req-audit.txt

  base-cli:
    # Kontrakt bazowej instalacji: CLI musi działać bez extra `gui` (bez PySide6).
    # Instalujemy TYLKO bazowe zależności + `dev` — żadnego toru Qt — i sprawdzamy,
    # że import/uruchomienie CLI oraz komenda core przechodzą, a warstwa gui/PySide6
    # nie jest w ogóle wciągana. Regresja (import gui z cli/core) wywali ten job.
    name: Base CLI (no GUI extra)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Bez utrwalania tokenu w .git/config — kod zależności go nie zobaczy.
        persist-credentials: false

    - name: Install uv (instalacja z uv.lock — reprodukowalne wersje)
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: "0.8.17"
        enable-cache: true

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Install base + dev deps only (BEZ extra gui — brak PySide6)
      # Świadomie bez `--extra gui`: to symuluje udokumentowaną instalację ze
      # źródeł na serwerze/headless. Jeśli lock wymusiłby PySide6, ten krok by go
      # nie zainstalował — a kolejny krok potwierdza jego brak.
      run: uv sync --frozen --extra dev --python 3.12

    - name: Assert PySide6 is NOT installed (sanity)
      run: |
        if uv run python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('PySide6') is None else 1)"; then
          echo "OK: PySide6 nieobecny w bazowym środowisku"
        else
          echo "BŁĄD: PySide6 zainstalowany w bazowym torze — extra gui przeciekło do bazy"
          exit 1
        fi

    - name: Smoke test — CLI działa bez GUI
      # `python -m epubforge` + entry point `epubforge` (help/version/komenda core).
      run: |
        uv run python -m epubforge --version
        uv run epubforge --help
        uv run epubforge info

    - name: Pytest bez PySide6 (pomija katalog gui, wyłącza plugin pytest-qt)
      # `-p no:pytest-qt`: plugin wymaga bindingu Qt już przy ładowaniu, a go nie ma.
      # Testy GUI (tests/gui) pomija `collect_ignore` w tests/gui/conftest.py, gdy
      # brak PySide6. Bez bramki pokrycia — kod GUI świadomie nie jest tu wykonywany.
      run: uv run pytest -p "no:pytest-qt" -m "not integration"

  webengine-headless:
    # Prawdziwy Chromium jest osobnym kontraktem. Flagi dotyczą wyłącznie
    # kontrolowanego runnera CI i nie są ustawiane w kodzie produkcyjnym.
    name: Qt WebEngine headless (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: "0.8.17"
        enable-cache: true
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install Chromium/Qt runtime libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2t64 libdbus-1-3 libegl1 libgbm1 libnss3 libxcomposite1 libxdamage1 libxkbcommon0 libxrandr2
    - name: Install locked Qt and test dependencies
      run: uv sync --frozen --extra dev --extra gui --extra images --extra fonts --python 3.12
    - name: Run real WebEngine tests with coverage
      env:
        EPUBFORGE_TEST_WEBENGINE: "1"
        QT_QPA_PLATFORM: offscreen
        QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      run: uv run pytest --cov=src/epubforge --cov-report=xml:coverage-webengine.xml -m "webengine and not integration"
    - name: Upload WebEngine coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        files: ./coverage-webengine.xml
        flags: webengine
        fail_ci_if_error: false

  windows-frozen-smoke:
    name: Windows frozen smoke (onefile + onedir)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EPUBFORGE_BUILD_VARIANT: full
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: "0.8.17"
        enable-cache: true
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install locked build dependencies
      run: uv sync --frozen --extra build --extra gui --python 3.12
    - name: Build full onefile and onedir
      working-directory: build
      run: |
        uv run python create_icon.py
        uv run python -m PyInstaller epubforge-portable.spec --clean --noconfirm --distpath dist --workpath build-tmp
        uv run python -m PyInstaller epubforge-dir.spec --clean --noconfirm --distpath dist --workpath build-tmp
    - name: Smoke both complete artifacts
      working-directory: build
      shell: pwsh
      run: |
        "| artifact | size (MiB) | cold self-check (s) |" >> $env:GITHUB_STEP_SUMMARY
        "|---|---:|---:|" >> $env:GITHUB_STEP_SUMMARY
        $cases = @(
          @{Name="onefile"; Exe="dist/epubforge.exe"; Log="selfcheck-onefile.log"; Bytes=(Get-Item "dist/epubforge.exe").Length},
          @{Name="onedir"; Exe="dist/epubforge/epubforge.exe"; Log="selfcheck-onedir.log"; Bytes=(Get-ChildItem "dist/epubforge" -Recurse -File | Measure-Object Length -Sum).Sum}
        )
        foreach ($case in $cases) {
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $case.Exe -ArgumentList "--self-check", $case.Log -Wait -PassThru
          $watch.Stop()
          if (Test-Path $case.Log) { Get-Content $case.Log }
          if ($proc.ExitCode -ne 0) { throw "frozen smoke failed: $($case.Exe)" }
          $size = [Math]::Round($case.Bytes / 1MB, 1)
          $seconds = [Math]::Round($watch.Elapsed.TotalSeconds, 2)
          "| $($case.Name) | $size | $seconds |" >> $env:GITHUB_STEP_SUMMARY
        }

  package:
    # Kontrakt dystrybucji (REL): sdist + wheel budują się czysto, koło nie ma
    # duplikatów, zawiera wszystkie zasoby + py.typed dokładnie raz i po instalacji
    # w pustym venv czyta je przez publiczne API — bez plików z checkoutu.
    name: Package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Bez utrwalania tokenu w .git/config — kod zależności go nie zobaczy.
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: "0.8.17"
        enable-cache: true

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Build sdist + wheel (koło budowane ZE SDISTA — domyślne uv build)
      run: uv build

    - name: Build wheel także z drzewa (kontrola tree vs sdist)
      run: uv build --wheel -o dist_tree

    - name: Parzystość kół — brak duplikatów, identyczny zestaw plików
      run: |
        uv run python build/check_wheel_parity.py \
          dist/epubforge-*.whl dist_tree/epubforge-*.whl

    - name: twine check (metadane sdista i koła)
      run: uv run --with twine twine check dist/*

    - name: Instalacja koła w pustym venv (bez extra gui)
      # Osobny interpreter, świeży venv — izolacja od środowiska uv projektu.
      run: |
        python -m venv /tmp/pkgvenv
        /tmp/pkgvenv/bin/python -m pip install --upgrade pip
        /tmp/pkgvenv/bin/python -m pip install dist/epubforge-*.whl

    - name: CLI z zainstalowanego koła
      run: |
        /tmp/pkgvenv/bin/epubforge --version
        /tmp/pkgvenv/bin/epubforge --help > /dev/null
        /tmp/pkgvenv/bin/epubforge info > /dev/null

    - name: Odczyt każdego zasobu przez publiczne API (spoza checkoutu)
      # `cd /tmp`: gwarantuje, że loadery nie sięgają po pliki z drzewa źródeł.
      run: |
        cd /tmp
        /tmp/pkgvenv/bin/python "$GITHUB_WORKSPACE/build/verify_wheel_resources.py"

  security-tests:
    # OSOBNY, STABILNY job testów bezpieczeństwa/odporności (fuzz/property, marker
    # `security`, F-18) — izolowany od matrycy, by regres bezpieczeństwa był
    # jednoznaczny i nie mieszał się z wynikami zwykłych testów. Dotyczy warstwy
    # core, więc instalujemy bazę + dev (bez extra gui / PySide6).
    name: Security tests (fuzz/property)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv (instalacja z uv.lock — reprodukowalne wersje)
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: "0.8.17"
        enable-cache: true

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Install base + dev deps (hypothesis w extra dev; bez gui)
      run: uv sync --frozen --extra dev --python 3.12

    - name: Run security tests (marker `security`)
      # `-p no:pytest-qt`: plugin wymaga bindingu Qt, którego tu nie ma. Testy GUI
      # pomija `collect_ignore` (tests/gui/conftest.py). Wybieramy tylko `security`.
      run: uv run pytest -m security -p "no:pytest-qt"
