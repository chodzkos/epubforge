name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Qt runtime libs (Linux only — dla testów GUI offscreen)
      # PySide6 w trybie offscreen i tak wymaga libEGL na headless Linuksie.
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type check with mypy (wszystkie platformy)
      # Sprawdzamy każdą platformę jawnie — kod warunkowany sys.platform
      # może mieć błędy widoczne tylko pod konkretnym --platform (np. unreachable).
      run: |
        mypy --platform linux src/
        mypy --platform darwin src/
        mypy --platform win32 src/

    - name: Test with pytest (offscreen Qt — wszystkie platformy)
      # PySide6 renderuje bezgłowo przez platformę 'offscreen' — bez xvfb i bez
      # wyłączania testów GUI na Windows/macOS.
      env:
        QT_QPA_PLATFORM: offscreen
      run: pytest --cov=src/epubforge --cov-report=xml -m "not integration"

    - name: Upload coverage (Linux + Python 3.12 only)
      if: runner.os == 'Linux' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
