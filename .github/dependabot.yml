# Dependabot — automatyczne PR-y z aktualizacjami zależności (supply-chain).
# Od REL-3 projekt lockuje zależności przez uv (uv.lock), więc ekosystem to `uv`
# — Dependabot podbija pyproject.toml i uv.lock razem. Drugi tor pilnuje wersji
# akcji przypiętych po SHA w .github/workflows/*: podbija SHA + komentarz wersji.
version: 2
updates:
  # Zależności Pythona z pyproject.toml + uv.lock. Git-referencje
  # (chodzkos-gui-kit @ SHA) Dependabot pomija — te pilnujemy przez pin po SHA.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Narzędzia deweloperskie (pytest, ruff, mypy, pre-commit, pdoc, …) w jednym
      # zbiorczym PR zamiast osobnego na każdy pakiet — mniej szumu w review.
      dev-dependencies:
        dependency-type: "development"

  # Akcje GitHub przypięte po SHA w workflowach — podbijanie SHA + komentarza.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Kroki init/analyze muszą używać identycznej wersji CodeQL Action.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
