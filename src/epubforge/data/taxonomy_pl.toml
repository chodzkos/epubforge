# Taksonomia tagów po polsku (Etap 29 roadmapy v3).
#
# Cztery kategorie: [[gatunek]], [[epoka]], [[miejsce]], [[tematy]]. Każdy wpis:
#   tag       = kanoniczna nazwa PL (to trafia do dc:subject),
#   synonyms  = warianty zapisu/nazwy sprowadzane do jednego kanonu
#               (np. "sci-fi" = "SF" = "science fiction" -> "science fiction"),
#   maps      = surowe stringi ze źródeł (deskryptory BN, kategorie LC/GB),
#               które mają zostać zmapowane na ten tag.
#
# Dopasowanie synonimów i mapowań jest odporne na wielkość liter i diakrytyki
# (porównanie po normalizacji), więc nie trzeba wpisywać wszystkich wariantów.
#
# Użytkownik może podłożyć własny plik `taxonomy_pl.toml` w katalogu konfiguracji
# EpubForge — ma on pierwszeństwo przed tym wbudowanym.

# ── Gatunek ─────────────────────────────────────────────────────────────────────

